name: Build BIRD BLAST APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Generate app icons
        run: npx capacitor-assets generate --android --iconBackgroundColor '#3fa7ff' --iconBackgroundColorDark '#3fa7ff'

      - name: Patch Android (landscape, fullscreen)
        run: python3 scripts/patch_android.py

      - name: Sync web assets
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk BIRD-BLAST.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BIRD-BLAST-apk
          path: BIRD-BLAST.apk
